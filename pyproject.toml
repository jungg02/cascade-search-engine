[project]
name = "cascade"
version = "0.1.0"
description = "A multi-stage search engine with an enforced latency budget"
requires-python = ">=3.11"
dependencies = [
    "ir-datasets>=0.5.9",
    "pytrec-eval-terrier>=0.5.6",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Secondary BM25 baseline. Prebuilt wheel; no Rust toolchain required.
baselines = [
    "tantivy>=0.22",
]
dev = [
    "pytest>=8.0",
    "pybind11>=2.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["py/tests"]
pythonpath = ["py"]
