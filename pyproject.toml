[project]
name = "cascade"
version = "0.1.0"
description = "A multi-stage search engine with an enforced latency budget"
requires-python = ">=3.11"
dependencies = [
    "ir-datasets>=0.5.9",
    "pytrec-eval-terrier>=0.5.6",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Secondary BM25 baseline. Prebuilt wheel; no Rust toolchain required.
baselines = [
    "tantivy>=0.22",
]
dev = [
    "pytest>=8.0",
    "pybind11>=2.12",
    "grpcio>=1.71",
    "grpcio-tools>=1.71",
]

# hnswlib ships no macOS wheel (sdist only) and its setup.py doesn't point
# clang++ at the SDK's libc++ headers (same class of issue as cpp/Makefile's
# SDK_PATH note) -- `uv sync --extra dense` on a fresh checkout, or after
# `uv cache clean`, needs:
#   SDK_PATH=$(xcrun --show-sdk-path)
#   CXXFLAGS="-isystem $SDK_PATH/usr/include/c++/v1" \
#   CPPFLAGS="-isystem $SDK_PATH/usr/include/c++/v1" \
#   uv sync --extra dense
dense = [
    "faiss-cpu>=1.15.0",
    "hnswlib>=0.8.0",
    "matplotlib>=3.11.1",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
]

# CPU-only versions of everything ONNX-related, for local smoke tests and for
# sharing code with the Kaggle driver (which additionally installs
# onnxruntime-gpu there -- see kaggle/README.md). torch is already present via
# the `dense` extra.
rank = [
    "transformers>=4.46.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxconverter-common>=1.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["py/tests", "py/server/tests", "py/dense/tests", "py/rank/tests"]
pythonpath = ["py"]
